# host_vars/local-workstation/main.yml
# Non-secret, host-specific overrides for the bare-metal ThinkPad E490.
#
# Real hardware (gathered live via lshw/dmidecode/lscpu/lsblk/lspci on
# 2026-09-19, see docs/README.md's "Tested Hardware Platform" for the full
# table): Lenovo ThinkPad E490 (20N9S19A00), Intel i5-8265U (4c/8t), 40GB
# DDR4, Toshiba NVMe 256GB, Intel UHD 620, Realtek Gigabit + Intel AX200
# Wi-Fi 6/Bluetooth. This is the only real bare-metal machine this repo's
# bare-metal-only tasks are validated against.
machine_role: "bare-metal"

# Tailscale device name for this host (differs from the inventory alias) —
# used by scripts/check_ip_drift.py to look up its live Tailscale IP.
tailscale_hostname: "PeakPulse"

# This laptop has one real, pre-existing account ("bean" — set up before
# stationctl ever touched the box, already has sudo, already has its own
# real login password). vm_enduser_name in group_vars/all/main.yml
# ("kenny") is only meant for remote-workstation; overridden here so
# nothing on this host creates or manages a separate "kenny" account.
vm_enduser_name: "bean"

# Mandatory (see setup-kernel-perf-tuning.yml) — real disk is SSD, not HDD.
workstation_drives:
  nvme0n1: "ssd"

# Bias toward disk swap over holding page cache in RAM, same policy as
# remote-workstation: swap proactively into zram first (still RAM-speed),
# reclaim page cache aggressively via vfs_cache_pressure, and let the real
# HDD swapfile absorb anything zram can't. No drop_caches timer here either
# — see remote-workstation/main.yml, the kernel reclaims clean cache on its
# own at this vfs_cache_pressure without a forced timer.
workstation_swappiness: 100
workstation_vfs_cache_pressure: 500
# Same rationale as remote-workstation: bump kswapd's reclaim/swap trigger
# point earlier instead of waiting for real pressure, for proactive swap
# usage over idle page cache. Same absolute value as remote-workstation.
workstation_min_free_kbytes: 307200

# Disk-swap overflow tier on the laptop's real SSD, below zram in priority.
workstation_swapfile_gb: 16

# security-harden.yml (CIS 4 / UFW) enables a default-deny-incoming
# firewall — this host was never firewalled before that playbook was
# unified with ansible-proxmox's, so TigerVNC (vnc_display: "1" ->
# port 5901, see group_vars/workstations.yml) must be explicitly allowed
# or remote desktop access breaks on first run.
cis_ufw_extra_ports:
- { port: "5901", proto: "tcp", comment: "TigerVNC remote desktop" }

# VNC off by default on this host (2026-09-21) — an always-on standing
# TigerVNC/MATE session was found racing the physical seat0 session for
# every udisks2 mount request, breaking USB drive mounting entirely.
# Toggle manually as needed: the "Remote Desktop (VNC)" desktop launcher
# (setup-remote-access.yml, deploy_vnc_toggle_launcher below) runs
# /usr/local/bin/vnc-toggle.sh via pkexec, or just
# `sudo systemctl start/stop tigervncserver@:1.service` directly.
vnc_service_enabled: false

# This host only — see setup-remote-access.yml's toggle-launcher tasks.
deploy_vnc_toggle_launcher: true

# Skip the "ask before restarting VNC" GUI safety-gate dialog on this host
# — it exists to protect an active VNC session on a VM you primarily
# access remotely (e.g. remote-workstation via Guacamole), which doesn't
# apply here: VNC is off by default on this bare-metal laptop and only
# ever toggled manually via pkexec (vnc-toggle.sh), never through this
# playbook's restart handler.
vnc_restart_safety_gate_enabled: false
