# host_vars/local-workstation/main.yml
# Non-secret, host-specific overrides for the bare-metal ThinkPad E490.
machine_role: "bare-metal"

# This laptop has one real, pre-existing account ("bean" — set up before
# stationctl ever touched the box, already has sudo, already has its own
# real login password). vm_enduser_name in group_vars/all/main.yml
# ("kenny") is only meant for remote-workstation; overridden here so
# nothing on this host creates or manages a separate "kenny" account.
vm_enduser_name: "bean"

# Mandatory (see setup-kernel-perf-tuning.yml) — real disk is SSD, not HDD.
workstation_drives:
  nvme0n1: "ssd"

# Bias toward disk swap over holding page cache in RAM, same policy as
# remote-workstation: swap proactively into zram first (still RAM-speed),
# reclaim page cache aggressively via vfs_cache_pressure, and let the real
# HDD swapfile absorb anything zram can't. No drop_caches timer here either
# — see remote-workstation/main.yml, the kernel reclaims clean cache on its
# own at this vfs_cache_pressure without a forced timer.
workstation_swappiness: 100
workstation_vfs_cache_pressure: 500
# Same rationale as remote-workstation: bump kswapd's reclaim/swap trigger
# point earlier instead of waiting for real pressure, for proactive swap
# usage over idle page cache. Same absolute value as remote-workstation.
workstation_min_free_kbytes: 307200

# Disk-swap overflow tier on the laptop's real SSD, below zram in priority.
workstation_swapfile_gb: 16
