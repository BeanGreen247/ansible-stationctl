# setup-kernel-perf-tuning.yml
#
# Overview
#   Deeper kernel/scheduler/network/IO tuning layer, on top of the
#   swap/cache policy setup-performance-tuning.yml already owns (zram,
#   swappiness, vfs_cache_pressure, min_free_kbytes — don't duplicate those
#   here). Adapted from this user's own reference tuning tools
#   (BeanGreen247/tuxthrottle, BeanGreen247/kubuntu-setup) with anything
#   GPU/gaming/Wi-Fi-specific dropped — these are headless-ish MATE VM/
#   laptop *workstations*, not gaming desktops.
#
#   Several tasks here (GRUB cmdline) only take effect on the next reboot —
#   that's expected, apply now and reboot when convenient.
#
# Target hosts
#   ansible-playbook setup-kernel-perf-tuning.yml --limit workstations
#
# Credit: tuning approach adapted from BeanGreen247/tuxthrottle and
# BeanGreen247/kubuntu-setup.
#
# Real hardware this is tested against (see docs/README.md's "Tested
# Hardware Platform" section for the full profile, gathered via lshw/
# dmidecode/lscpu on the live host): local-workstation is a real Lenovo
# ThinkPad E490 (Intel i5-8265U, 4c/8t) — the bare-metal machine_role path
# through this playbook (GRUB cmdline, drive-type map, etc.) runs on real
# firmware/hardware, not a VM guessing at what bare metal looks like.
---
- name: Deeper kernel/scheduler/network/IO performance tuning
  hosts: workstations
  become: true
  gather_facts: true

  tasks:

  # Drive types — mandatory per host (host_vars/<host>/main.yml), no
  # fallback default. This exists because "is this box on an SSD or an
  # HDD" was previously just an assumption baked into comments (and one of
  # those assumptions was wrong: local-workstation was thought to be HDD,
  # it's actually SSD) — decisions like preload/fstrim below now read this
  # map instead of a guess. Format: { device_name: "ssd"|"hdd", ... },
  # e.g. { sda: "ssd" } or { sda: "hdd", sdb: "ssd" }. Check real devices
  # with `lsblk -d -o NAME,ROTA,TYPE` (ROTA=0 is SSD/NVMe, ROTA=1 is HDD)
  # before setting this. This is independent from the per-device
  # rotational udev rule further down (that one reads live sysfs and needs
  # no manual map) — this map only drives host-wide "does this box have
  # any HDD/SSD at all" choices like preload and fstrim.
  - name: Ensure workstation_drives is defined for this host (mandatory)
    ansible.builtin.assert:
      that:
        - workstation_drives is defined
        - workstation_drives | length > 0
      fail_msg: >-
        workstation_drives is required in host_vars/{{ inventory_hostname }}/main.yml
        — map each real disk device to its type, e.g. { sda: "ssd" } or
        { sda: "hdd", sdb: "ssd" }. Check with: lsblk -d -o NAME,ROTA,TYPE
    tags: [kperf, always, drives]

  - name: Determine drive mix for this host
    ansible.builtin.set_fact:
      _stationctl_has_hdd: "{{ 'hdd' in (workstation_drives.values() | list) }}"
      _stationctl_has_ssd: "{{ 'ssd' in (workstation_drives.values() | list) }}"
    tags: [kperf, always, drives]

  # ---------------------------------------------------------------------
  # CPU governor
  # ---------------------------------------------------------------------
  - name: Install cpufrequtils (CPU governor control)
    ansible.builtin.apt:
      name: linux-cpupower
      state: present
      update_cache: true
      cache_valid_time: 3600
    register: _stationctl_cpupower_install
    failed_when: false
    tags: [kperf, cpu]

  # Explicit override wins; otherwise pick by machine_role (host_vars) —
  # a VM has no battery/thermal cost to "performance" pinned 24/7, a real
  # laptop on battery does. See group_vars/workstations.yml for the table.
  - name: Resolve CPU governor (manual override or auto-detected from machine_role)
    ansible.builtin.set_fact:
      _stationctl_cpu_governor: >-
        {{ workstation_cpu_governor
           if (workstation_cpu_governor | default('auto') != 'auto')
           else ('performance' if (machine_role | default('vm') == 'vm') else 'schedutil') }}
    tags: [kperf, cpu]

  # QEMU/KVM guests often don't expose cpufreq at all (host controls real
  # frequency scaling) — this is a best-effort oneshot, never fails the play
  # when there's no cpufreq sysfs to write to.
  - name: Force resolved CPU governor via oneshot service
    ansible.builtin.copy:
      dest: /etc/systemd/system/stationctl-cpu-performance.service
      content: |
        [Unit]
        Description=Force {{ _stationctl_cpu_governor }} CPU governor (stationctl)
        ConditionPathExists=/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

        [Service]
        Type=oneshot
        ExecStart=/bin/sh -c 'for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo {{ _stationctl_cpu_governor }} > "$f" 2>/dev/null || true; done'
        RemainAfterExit=true

        [Install]
        WantedBy=multi-user.target
      owner: root
      group: root
      mode: "0644"
    notify: Reload systemd and enable cpu-performance service
    tags: [kperf, cpu]

  # ---------------------------------------------------------------------
  # GRUB kernel cmdline — takes effect on next reboot only
  # ---------------------------------------------------------------------
  # mitigations=off is deliberately NOT included by default: it disables
  # Spectre/Meltdown/etc CPU-vulnerability mitigations for a real perf gain
  # on older CPUs, at a real security cost. Opt in per host with
  # workstation_kernel_mitigations_off: true if that trade-off is wanted.
  - name: Configure GRUB kernel cmdline performance flags (drop-in, requires reboot)
    ansible.builtin.copy:
      dest: /etc/default/grub.d/stationctl-perf.cfg
      content: |
        # Managed by ansible-stationctl (setup-kernel-perf-tuning.yml) — do not edit by hand.
        # nowatchdog/noirqdebug: drop NMI/softlockup watchdog + IRQ debug overhead
        # threadirqs: IRQ handlers as schedulable kernel threads (lower worst-case latency)
        # preempt=full: full kernel preemption for lowest scheduling latency
        # transparent_hugepage=madvise: only opt-in processes (JVM/DB/etc) get THP, no khugepaged background scan cost
        # audit=0: disable kernel audit subsystem (no compliance requirement on these boxes)
        # loglevel=3: quieter console, still keeps errors/warnings
        GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} nowatchdog noirqdebug threadirqs preempt=full transparent_hugepage=madvise audit=0 loglevel=3{{ ' mitigations=off' if (workstation_kernel_mitigations_off | default(false) | bool) else '' }}"
      owner: root
      group: root
      mode: "0644"
    notify: Update GRUB
    tags: [kperf, grub]

  # Belt-and-suspenders alongside the notify above: notify only fires on a
  # *changed* copy, so a run that dies on a later task (before handlers
  # flush) or a re-run where the drop-in already matched can silently skip
  # regenerating grub.cfg even though the drop-in file itself is correct.
  # Check the actual compiled grub.cfg, not just whether we wrote the source.
  - name: Check whether grub.cfg already has the stationctl cmdline flags
    ansible.builtin.command: grep -q 'nowatchdog noirqdebug threadirqs preempt=full' /boot/grub/grub.cfg
    register: _stationctl_grub_cfg_check
    changed_when: false
    failed_when: false
    tags: [kperf, grub]

  - name: Regenerate grub.cfg if it's missing the stationctl cmdline flags
    ansible.builtin.command: update-grub
    when: _stationctl_grub_cfg_check.rc != 0
    tags: [kperf, grub]

  # ---------------------------------------------------------------------
  # Transparent Huge Pages — applied live via sysfs too (tmpfiles.d), so it
  # takes effect immediately rather than waiting on the GRUB cmdline reboot.
  # ---------------------------------------------------------------------
  - name: Set THP mode to madvise immediately (tmpfiles.d, survives reboot too)
    ansible.builtin.copy:
      dest: /etc/tmpfiles.d/stationctl-thp.conf
      content: |
        w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
        w /sys/kernel/mm/transparent_hugepage/defrag - - - - madvise
      owner: root
      group: root
      mode: "0644"
    notify: Apply tmpfiles now
    tags: [kperf, thp]

  # Same belt-and-suspenders reasoning as the GRUB check above — verify the
  # live sysfs value, don't just trust the notify fired.
  - name: Check current live THP mode
    ansible.builtin.command: grep -q '\[madvise\]' /sys/kernel/mm/transparent_hugepage/enabled
    register: _stationctl_thp_check
    changed_when: false
    failed_when: false
    tags: [kperf, thp]

  - name: Apply THP mode now if sysfs doesn't already show madvise
    ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/stationctl-thp.conf
    when: _stationctl_thp_check.rc != 0
    tags: [kperf, thp]

  # ---------------------------------------------------------------------
  # vm.*, kernel.*, net.* sysctls not already owned by setup-performance-tuning.yml
  # ---------------------------------------------------------------------
  - name: Configure additional VM/scheduler/network sysctls
    ansible.builtin.copy:
      dest: /etc/sysctl.d/99-stationctl-kernel-perf.conf
      content: |
        # Managed by ansible-stationctl (setup-kernel-perf-tuning.yml) — do not edit by hand.
        # vm.swappiness / vm.vfs_cache_pressure / vm.min_free_kbytes live in
        # setup-performance-tuning.yml's own sysctl.d files, not here.

        # --- Memory / writeback ---
        vm.dirty_ratio = 15
        vm.dirty_background_ratio = 5
        vm.dirty_expire_centisecs = 1500
        vm.watermark_scale_factor = 125
        vm.watermark_boost_factor = 0
        vm.page-cluster = 4
        vm.compaction_proactiveness = 0
        vm.zone_reclaim_mode = 0
        vm.stat_interval = 10
        vm.max_map_count = 2147483642

        # --- Scheduler ---
        kernel.sched_autogroup_enabled = 1
        kernel.nmi_watchdog = 0
        kernel.numa_balancing = 0
        kernel.hung_task_timeout_secs = 300

        # --- Filesystem / fd limits ---
        fs.inotify.max_user_watches = 524288
        fs.pipe-max-size = 4194304
        fs.file-max = 2147483152

        # --- Network: BBR + fq, sized for a 2 vCPU / small-RAM workstation ---
        net.ipv4.tcp_congestion_control = bbr
        net.core.default_qdisc = fq
        net.core.rmem_max = 134217728
        net.core.wmem_max = 134217728
        net.ipv4.tcp_fastopen = 3
        net.ipv4.tcp_notsent_lowat = 16384
        net.ipv4.tcp_slow_start_after_idle = 0
        net.ipv4.tcp_keepalive_time = 120
        net.ipv4.tcp_mtu_probing = 1
        net.ipv4.tcp_rfc1337 = 1
        net.ipv4.tcp_max_tw_buckets = 2000000
        net.ipv4.ip_local_port_range = 1024 65535
        net.core.somaxconn = 8192
        net.core.netdev_max_backlog = 16384
        net.core.netdev_budget = 600
        net.core.netdev_budget_usecs = 8000
      owner: root
      group: root
      mode: "0644"
    register: _stationctl_kperf_sysctl
    tags: [kperf, sysctl]

  - name: Ensure tcp_bbr and sch_fq kernel modules are loaded at boot
    ansible.builtin.copy:
      dest: /etc/modules-load.d/stationctl-bbr.conf
      content: |
        tcp_bbr
        sch_fq
      owner: root
      group: root
      mode: "0644"
    notify: Load bbr/fq modules now
    tags: [kperf, sysctl]

  - name: Apply the new sysctls now (no reboot needed)
    ansible.builtin.command: sysctl --system
    when: _stationctl_kperf_sysctl.changed
    changed_when: true
    tags: [kperf, sysctl]

  # I/O scheduler — BFQ for rotational disks (desktop responsiveness under
  # background I/O), none/noop for non-rotational (host/hypervisor or the
  # SSD's own controller already schedules; a guest-side scheduler on top
  # just adds latency). zram/loop devices are excluded — no scheduler
  # concept applies to them.
  #
  # Readahead: kernel default (128KB) is conservative for sequential reads
  # on real rotational media — bumped to 1MB on rotational devices only,
  # pairs naturally with BFQ's latency-friendly scheduling for background
  # I/O while still helping large sequential reads. Left at kernel default
  # on non-rotational — SSD/NVMe controllers don't benefit the same way,
  # and a bigger readahead window just spends more page cache per read on
  # a small-RAM box for no gain there. Set via udev (ATTR{queue/rotational}
  # is live sysfs, same source of truth as the scheduler rule above), not a
  # one-shot blockdev --setra command that would need to be re-run every
  # boot.
  - name: Ensure the bfq IO scheduler module is loaded (built into Debian's stock kernel)
    community.general.modprobe:
      name: bfq
      state: present
    failed_when: false
    tags: [kperf, io]

  - name: Deploy udev rule for rotational vs non-rotational IO scheduler and readahead
    ansible.builtin.copy:
      dest: /etc/udev/rules.d/60-stationctl-ioscheduler.rules
      content: |
        # Managed by ansible-stationctl (setup-kernel-perf-tuning.yml) — do not edit by hand.
        ACTION=="add|change", KERNEL=="sd[a-z]|vd[a-z]", ATTR{queue/rotational}=="1", ATTR{queue/scheduler}="bfq", ATTR{queue/read_ahead_kb}="1024"
        ACTION=="add|change", KERNEL=="sd[a-z]|vd[a-z]", ATTR{queue/rotational}=="0", ATTR{queue/scheduler}="none"
        ACTION=="add|change", KERNEL=="nvme[0-9]n[0-9]", ATTR{queue/scheduler}="none"
      owner: root
      group: root
      mode: "0644"
    notify: Reload udev rules and retrigger
    tags: [kperf, io]

  # ---------------------------------------------------------------------
  # Resource limits (nofile/nproc) — dev tooling (Docker, Node, browsers,
  # editors) routinely wants more than the Debian default 1024 nofile.
  # ---------------------------------------------------------------------
  - name: Raise nofile/nproc limits for interactive + service processes
    ansible.builtin.copy:
      dest: /etc/security/limits.d/99-stationctl.conf
      content: |
        * soft nofile 524288
        * hard nofile 1048576
        * soft nproc 65536
        * hard nproc 65536
        * soft memlock unlimited
        * hard memlock unlimited
      owner: root
      group: root
      mode: "0644"
    tags: [kperf, limits]

  - name: Ensure /etc/systemd/system.conf.d exists
    ansible.builtin.file:
      path: /etc/systemd/system.conf.d
      state: directory
      owner: root
      group: root
      mode: "0755"
    tags: [kperf, limits]

  - name: Raise systemd's own default nofile/tasks limits (services inherit these)
    ansible.builtin.copy:
      dest: /etc/systemd/system.conf.d/99-stationctl-limits.conf
      content: |
        [Manager]
        DefaultLimitNOFILE=1048576
        DefaultTimeoutStopSec=10s
        DefaultTimeoutStartSec=30s
        DefaultDeviceTimeoutSec=10s
      owner: root
      group: root
      mode: "0644"
    notify: Reload systemd
    tags: [kperf, limits]

  # ---------------------------------------------------------------------
  # journald — cap disk usage, keep boot/service logs but don't let them grow
  # unbounded on a small-disk workstation.
  # ---------------------------------------------------------------------
  - name: Ensure /etc/systemd/journald.conf.d exists
    ansible.builtin.file:
      path: /etc/systemd/journald.conf.d
      state: directory
      owner: root
      group: root
      mode: "0755"
    tags: [kperf, journald]

  - name: Bound journald disk usage
    ansible.builtin.copy:
      dest: /etc/systemd/journald.conf.d/99-stationctl.conf
      content: |
        [Journal]
        Compress=yes
        SystemMaxUse=256M
        RateLimitBurst=1000
      owner: root
      group: root
      mode: "0644"
    notify: Restart journald
    tags: [kperf, journald]

  # Small daemons that pay for themselves: irqbalance spreads hardware IRQs
  # across vCPUs. Cheap and safe on a 2 vCPU / small-RAM box regardless of
  # drive type, so it's unconditional.
  #
  # preload's value proposition is readahead prediction to hide rotational-
  # disk seek latency — a real win on an HDD, close to zero (or a net
  # negative: it's still a persistent daemon writing its stats DB
  # periodically) on SSD/NVMe. Gate it on workstation_drives (host_vars)
  # instead of assuming — a previous version of this comment assumed
  # local-workstation was HDD; it's actually SSD, which is exactly the kind
  # of guess this variable exists to remove.
  - name: Install irqbalance (all hosts)
    ansible.builtin.apt:
      name: irqbalance
      state: present
      update_cache: true
      cache_valid_time: 3600
    tags: [kperf, services]

  - name: Ensure irqbalance is enabled and running
    ansible.builtin.systemd:
      name: irqbalance.service
      state: started
      enabled: true
    tags: [kperf, services]

  - name: Install preload (only on hosts with an HDD)
    ansible.builtin.apt:
      name: preload
      state: present
      update_cache: true
      cache_valid_time: 3600
    when: _stationctl_has_hdd
    tags: [kperf, services]

  - name: Ensure preload is enabled and running (only on hosts with an HDD)
    ansible.builtin.systemd:
      name: preload.service
      state: started
      enabled: true
    when: _stationctl_has_hdd
    tags: [kperf, services]

  - name: Ensure preload is disabled on all-SSD/NVMe hosts
    ansible.builtin.systemd:
      name: preload.service
      state: stopped
      enabled: false
    when: not _stationctl_has_hdd
    failed_when: false
    tags: [kperf, services]

  # earlyoom: kill the actual runaway process at low-memory before the box
  # grinds into unresponsive swap-thrash — a good complement to the
  # swap-heavy policy in setup-performance-tuning.yml (that policy makes
  # swap absorb pressure; earlyoom is the backstop for when even that isn't
  # enough). systemd-oomd does the same job and the two fighting each other
  # is worse than either alone, so disable systemd-oomd here.
  #
  # Stock config has no opinion about which process is actually worth
  # saving on THIS fleet — a backstop that picks its kill target blind is
  # only half a backstop. --avoid protects the session itself (X/VNC
  # server, display manager pieces, dbus, systemd/sshd) so a kill doesn't
  # take down the very thing you'd SSH/VNC in to recover with; --prefer
  # targets the actual usual-suspect runaway processes (browser, docker
  # builds, node, java) first. No embedded quotes in the regexes below —
  # ExecStart's $EARLYOOM_ARGS substitution does plain whitespace-splitting
  # on the expanded value, so a quoted-with-spaces regex would pass the
  # literal quote characters through as part of the pattern; keeping each
  # regex as one unbroken token sidesteps that entirely.
  - name: Install earlyoom
    ansible.builtin.apt:
      name: earlyoom
      state: present
      update_cache: true
      cache_valid_time: 3600
    tags: [kperf, oom]

  - name: Configure earlyoom kill preferences
    ansible.builtin.copy:
      dest: /etc/default/earlyoom
      content: |
        EARLYOOM_ARGS="-r 3600 --avoid ^(Xorg|Xvnc|Xtigervnc|sshd|systemd|dbus-daemon|mate-session|mate-panel|mate-settings-daemon|lightdm)$ --prefer ^(chrome|chromium|brave|brave-browser|node|docker|containerd-shim|java)$"
      owner: root
      group: root
      mode: "0644"
    notify: Restart earlyoom
    tags: [kperf, oom]

  - name: Enable and start earlyoom
    ansible.builtin.systemd:
      name: earlyoom.service
      state: started
      enabled: true
    tags: [kperf, oom]

  - name: Disable systemd-oomd (avoid fighting earlyoom)
    ansible.builtin.systemd:
      name: systemd-oomd.service
      state: stopped
      enabled: false
    failed_when: false
    tags: [kperf, oom]

  - name: Print kernel perf tuning summary
    ansible.builtin.debug:
      msg:
      - "========================================================"
      - "Kernel/scheduler/network tuning applied on: {{ inventory_hostname }}"
      - "  CPU governor: {{ _stationctl_cpu_governor }} (if cpufreq exposed by hypervisor)"
      - "  GRUB cmdline: nowatchdog noirqdebug threadirqs preempt=full transparent_hugepage=madvise audit=0 loglevel=3{{ ' mitigations=off' if (workstation_kernel_mitigations_off | default(false) | bool) else '' }}"
      - "  >>> REBOOT REQUIRED for the GRUB cmdline change to take effect <<<"
      - "  THP: madvise (applied live)"
      - "  TCP: bbr + fq"
      - "  IO scheduler: bfq (rotational) / none (non-rotational), via udev"
      - "  irqbalance/preload: enabled"
      - "  earlyoom: enabled, systemd-oomd: disabled"
      - "========================================================"
    tags: [kperf, summary]

  handlers:
  - name: Reload systemd and enable cpu-performance service
    ansible.builtin.systemd:
      name: stationctl-cpu-performance.service
      state: started
      enabled: true
      daemon_reload: true

  - name: Update GRUB
    ansible.builtin.command: update-grub

  - name: Apply tmpfiles now
    ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/stationctl-thp.conf

  - name: Load bbr/fq modules now
    ansible.builtin.command: "{{ item }}"
    loop:
      - modprobe tcp_bbr
      - modprobe sch_fq
    failed_when: false

  - name: Reload udev rules and retrigger
    ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=block

  - name: Reload systemd
    ansible.builtin.systemd:
      daemon_reload: true

  - name: Restart earlyoom
    ansible.builtin.systemd:
      name: earlyoom.service
      state: restarted

  - name: Restart journald
    ansible.builtin.systemd:
      name: systemd-journald.service
      state: restarted
