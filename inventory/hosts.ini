# inventory/hosts.ini
# -----------------------------------------------------------------------
# Workstations — one playbook set, identical environment, any machine type.
# Used by: setup-ansibleuser.yml, setup-base-debian.yml, setup-mate-desktop.yml,
#          setup-dev-tools.yml, setup-remote-access.yml, setup-performance-tuning.yml,
#          site.yml
# -----------------------------------------------------------------------

[remote-workstation]
# Proxmox VM on the homelab host (starhaven, VMID 115) — provisioned via
# ansible-proxmox/auto-install-debian.yml. Tailscale IP (stable — LAN DHCP
# lease can change on reboot, this doesn't).
remote-workstation ansible_port=22 ansible_host=100.101.178.0 ansible_user=ansibleuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[local-workstation]
# Bare-metal Debian on the ThinkPad E490 ("PeakPulse"). Tailscale IP (stable
# — LAN DHCP lease can change on reboot, this doesn't; see the 2026-09-17
# reboot where the LAN IP moved from .235 to .234).
# Add "ansible_connection=local" instead of ansible_host if you run the playbook
# directly on the laptop rather than over SSH from elsewhere.
local-workstation ansible_port=22 ansible_host=100.65.108.57 ansible_user=ansibleuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[workstations:children]
remote-workstation
local-workstation
