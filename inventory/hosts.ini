# inventory/hosts.ini
# -----------------------------------------------------------------------
# Workstations — one playbook set, identical environment, any machine type.
# Used by: setup-ansibleuser.yml, setup-base-debian.yml, setup-mate-desktop.yml,
#          setup-dev-tools.yml, setup-remote-access.yml, setup-performance-tuning.yml,
#          site.yml
# -----------------------------------------------------------------------

[remote-workstation]
# Proxmox VM on the homelab host (starhaven, VMID 115) — provisioned via
# ansible-proxmox/auto-install-debian.yml.
remote-workstation ansible_port=22 ansible_host=192.168.0.215 ansible_user=ansibleuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[local-workstation]
# Bare-metal Debian on the ThinkPad E490 — fill in the real IP/hostname once installed.
# Add "ansible_connection=local" instead of ansible_host if you run the playbook
# directly on the laptop rather than over SSH from elsewhere.
local-workstation ansible_port=22 ansible_host=192.168.0.235 ansible_user=ansibleuser ansible_ssh_private_key_file=~/.ssh/id_rsa

[workstations:children]
remote-workstation
local-workstation
