# setup-remote-access.yml
#
# Overview
#   Wires up remote access for the workstation: TigerVNC (X11 — see the
#   Wayland limitation noted in setup-mate-desktop.yml) launching a MATE
#   session, using the package-provided tigervncserver@:N.service (NOT a
#   custom unit — trixie's tigervnc-standalone-server ships its own
#   tigervncsession-start/vncserver.users mechanism and a hand-rolled unit
#   fighting its PID-file/hostname conventions just times out), plus
#   Tailscale for private network reachability (matches the existing
#   homelab pattern — no exposed ports, same as the Starhaven homelab).
#
#   VNC password: set non-interactively from vnc_password (vault-encrypted
#   in group_vars/all/main.yml, which is gitignored — same pattern as
#   vault_become_password). This is what you enter as the connection
#   password when adding this workstation in Guacamole.
#
# Target hosts
#   ansible-playbook setup-remote-access.yml --limit workstations
#
# Credit: Thomas Mozdren
---
- name: Configure remote access (TigerVNC + Tailscale)
  hosts: workstations
  become: true
  gather_facts: true

  tasks:

  # Safety gate: restarting the VNC server (handler below) kills the Xvnc
  # process outright — anyone connected right now gets dropped mid-session,
  # no warning. A plain TCP-ESTABLISHED check on the VNC port only catches
  # someone actively streaming frames at that exact instant — it silently
  # misses "logged in but idle" (client connected, nothing moving on
  # screen right now) and can race a client reconnect. Confirmed missed a
  # real session on 2026-09-21. Check for an actual MATE session process
  # instead — true for both "actively watching" and "idle but logged in",
  # and for a physical seat0 login on local-workstation too.
  # vnc_restart_safety_gate_enabled defaults to true (protects VNC/Guacamole
  # hosts like remote-workstation, where the VNC session IS the primary way
  # someone is using the machine). Set to false in a host's host_vars to
  # skip this whole dialog on hosts where it doesn't apply — e.g.
  # local-workstation, where VNC is off by default (vnc_service_enabled:
  # false) and toggled manually via pkexec (see the vnc-toggle.sh launcher
  # below), never through this playbook's restart handler at all.
  - name: Check whether a MATE session is running for the end-user
    ansible.builtin.command: "pgrep -u {{ vm_enduser_name }} -x mate-session"
    register: vnc_active_check
    changed_when: false
    failed_when: false
    when: (vm_enduser_name | default('') | length > 0) and (vnc_restart_safety_gate_enabled | default(true) | bool)
    tags: [remote-access, vnc, safety]

  - name: Set fact for active session
    ansible.builtin.set_fact:
      vnc_has_active_session: "{{ (vnc_active_check.rc | default(1)) == 0 }}"
    tags: [remote-access, vnc, safety]

  # A CLI `pause` prompt only works when this playbook is run from an
  # attached terminal — it's silently useless (proceeds without ever
  # really asking) when driven non-interactively, which is exactly how a
  # 2026-09-21 run restarted VNC and dropped a live session with no
  # warning. Pop a real dialog into the user's own X session instead, so
  # the confirmation reaches them wherever they actually are. Only
  # installed/run when a session was actually found above.
  - name: Install VNC-restart confirmation dialog dependencies
    ansible.builtin.apt:
      name: "{{ vnc_restart_prompt_packages }}"
      state: present
      update_cache: true
      cache_valid_time: 3600
    when: vnc_has_active_session
    tags: [remote-access, vnc, safety]

  - name: Ensure the restart-prompt dialog theme directory exists
    ansible.builtin.file:
      path: /etc/stationctl/vnc-restart-prompt-theme/gtk-3.0
      state: directory
      owner: root
      group: root
      mode: "0755"
    when: vnc_has_active_session
    tags: [remote-access, vnc, safety]

  # yad in trixie has no --css flag — GTK3's own per-process config-dir CSS
  # autoload (XDG_CONFIG_HOME/gtk-3.0/gtk.css) is what actually renders
  # this, scoped to just the one dialog invocation via an env var, not the
  # user's real session config.
  - name: Deploy the restart-prompt dialog's gradient theme (GTK3 CSS)
    ansible.builtin.copy:
      dest: /etc/stationctl/vnc-restart-prompt-theme/gtk-3.0/gtk.css
      content: |
        window, .background {
          background-image: linear-gradient(135deg, #b30000, #ff8c00);
        }
        label { color: #ffffff; font-weight: bold; }
      owner: root
      group: root
      mode: "0644"
    when: vnc_has_active_session
    tags: [remote-access, vnc, safety]

  - name: Deploy the VNC-restart confirmation dialog script
    ansible.builtin.copy:
      src: files/remote-access/stationctl-vnc-restart-prompt.sh
      dest: /usr/local/bin/stationctl-vnc-restart-prompt.sh
      owner: root
      group: root
      mode: "0755"
    when: vnc_has_active_session
    tags: [remote-access, vnc, safety]

  # Fails safe: no session found (script never got this far), dialog
  # closed/declined, or the timeout elapses unanswered all leave rc != 0,
  # so vnc_restart_ok below stays false and the handler skips the restart.
  - name: Ask the logged-in user before restarting VNC (GUI dialog, fails safe)
    ansible.builtin.command: >-
      /usr/local/bin/stationctl-vnc-restart-prompt.sh
      {{ vm_enduser_name }} {{ inventory_hostname }} :{{ vnc_display }} {{ vnc_restart_prompt_timeout }}
    register: vnc_restart_confirm
    changed_when: false
    failed_when: false
    when: vnc_has_active_session
    tags: [remote-access, vnc, safety]

  - name: Record whether the VNC restart may proceed
    ansible.builtin.set_fact:
      vnc_restart_ok: "{{ (not vnc_has_active_session) or ((vnc_restart_confirm.rc | default(1)) == 0) }}"
    tags: [remote-access, vnc, safety]

  - name: Install TigerVNC packages
    ansible.builtin.apt:
      name: "{{ remote_access_packages }}"
      state: present
      update_cache: true
      cache_valid_time: 3600
    tags: [remote-access, vnc, packages]

  - name: Ensure end-user's .vnc directory exists
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.vnc"
      state: directory
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0700"
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc]

  # TigerVNC on trixie migrates ~/.vnc to the XDG path ~/.config/tigervnc on
  # first run (File::Copy::mv, which needs the parent dir to already exist —
  # it won't create ~/.config itself). Without this, vncserver fails with
  # "Could not migrate ~/.vnc to ~/.config/tigervnc."
  - name: Ensure end-user's .config directory exists (tigervnc XDG migration target)
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.config"
      state: directory
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0700"
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc]

  # No custom ~/.vnc/xstartup here on purpose: it would take priority over
  # $session below (see tigervncsession(8) FILES) and bypass the packaged
  # session-selection mechanism entirely.
  - name: Remove any legacy per-user xstartup (would override $session)
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.vnc/xstartup"
      state: absent
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc]

  # Found 2026-09-20 on local-workstation: a VNC login and a physical seat0
  # login for the same user both land on the systemd-activated user bus
  # (/run/user/<uid>/bus) — confirmed via /proc/<pid>/environ on both
  # mate-session processes, both showing the identical
  # DBUS_SESSION_BUS_ADDRESS. Whichever mate-session starts second loses the
  # race to claim org.gnome.SessionManager on that shared bus
  # ("WARNING: Failed to acquire org.gnome.SessionManager" in journalctl).
  # The packaged /etc/X11/Xtigervnc-session (dpkg conffile, not something
  # of ours) hands off straight to /etc/X11/Xsession on that shared bus.
  # Wrapping that handoff in dbus-run-session gives the VNC session its own
  # private bus, so it no longer contends with a concurrent physical login
  # (or a second VNC display) for the same well-known names.
  - name: Give the VNC X session its own private D-Bus session bus (avoid clashing with a physical login)
    ansible.builtin.replace:
      path: /etc/X11/Xtigervnc-session
      regexp: '^exec /etc/X11/Xsession "\$@"$'
      replace: 'exec dbus-run-session -- /etc/X11/Xsession "$@"'
    notify: Restart VNC server
    tags: [remote-access, vnc]

  # No `creates:` guard here on purpose: this file can get silently
  # replaced by something else with the same name (e.g. a stray home-dir
  # sync from another machine) — a `creates:` guard would then leave the
  # wrong password in place forever since the file already "exists".
  # tigervncpasswd's output is deterministic for a given password (DES,
  # no salt), so unconditionally rewriting it is idempotent in effect.
  - name: Set VNC session password non-interactively (tigervncpasswd -f)
    ansible.builtin.shell: |
      set -o pipefail
      printf '%s\n' "{{ vnc_password }}" | tigervncpasswd -f > /home/{{ vm_enduser_name }}/.vnc/passwd
    args:
      executable: /bin/bash
    become: true
    become_user: "{{ vm_enduser_name }}"
    no_log: true
    when: vm_enduser_name | default('') | length > 0
    notify: Restart VNC server
    tags: [remote-access, vnc]

  - name: Lock down VNC password file permissions
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.vnc/passwd"
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0600"
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc]

  # Found 2026-09-20: the packaged tigervncsession-start (used by
  # tigervncserver@.service — see this file's header, NOT the legacy
  # `vncserver` Perl wrapper) reads the password straight from the XDG
  # path ~/.config/tigervnc/passwd and does NOT do the ~/.vnc ->
  # ~/.config/tigervnc migration copy itself; only the legacy `vncserver`
  # command does that mv. A host whose password was ever set without that
  # legacy command running first (local-workstation, set 2026-09-19) ends
  # up with only ~/.vnc/passwd, so Xtigervnc finds no password file, falls
  # back to an interactive prompt on a non-interactive service TTY, and
  # dies with "getpassword error: Inappropriate ioctl for device" —
  # confirmed live via journalctl + the session log in
  # ~/.local/state/tigervnc/. remote-workstation happened to already have
  # both copies (from an earlier manual `vncserver` run) so it never hit
  # this. Copy unconditionally (same rationale as the no-`creates:`-guard
  # note above) so both paths always agree.
  - name: Ensure XDG tigervnc config directory exists
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.config/tigervnc"
      state: directory
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0700"
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc]

  - name: Mirror VNC password to the XDG path tigervncsession-start actually reads
    ansible.builtin.copy:
      src: "/home/{{ vm_enduser_name }}/.vnc/passwd"
      dest: "/home/{{ vm_enduser_name }}/.config/tigervnc/passwd"
      remote_src: true
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0600"
    when: vm_enduser_name | default('') | length > 0
    notify: Restart VNC server
    tags: [remote-access, vnc]

  - name: Remove old stationctl-vncserver custom unit if present (superseded)
    ansible.builtin.systemd:
      name: "stationctl-vncserver@{{ vnc_display }}"
      state: stopped
      enabled: false
    failed_when: false
    tags: [remote-access, vnc, systemd]

  - name: Remove old stationctl-vncserver unit file
    ansible.builtin.file:
      path: /etc/systemd/system/stationctl-vncserver@.service
      state: absent
    notify: Reload systemd
    tags: [remote-access, vnc, systemd]

  - name: Assign VNC display to end-user (/etc/tigervnc/vncserver.users)
    ansible.builtin.lineinfile:
      path: /etc/tigervnc/vncserver.users
      regexp: "^:{{ vnc_display }}="
      line: ":{{ vnc_display }}={{ vm_enduser_name }}"
      create: true
      owner: root
      group: root
      mode: "0644"
    when: vm_enduser_name | default('') | length > 0
    tags: [remote-access, vnc, systemd]

  # A Tailscale-interface restriction was tried here 2026-09-18 and
  # REVERTED the same day — live testing showed Xtigervnc actually bound to
  # 127.0.0.1-only (not the intended Tailscale IP, not 0.0.0.0), making VNC
  # completely unreachable from anywhere, Tailscale included. Root cause
  # not fully diagnosed (possibly the Tailscale interface not being fully
  # up at the exact moment Xtigervnc bound its socket, despite `tailscale
  # ip -4` having already succeeded when ansible ran) — not worth
  # re-attempting without a much more careful test plan; reachability over
  # the existing VncAuth password protection matters more here than the
  # marginal hardening gain. Back to listening on all interfaces, the
  # known-good state.
  - name: Set system-wide policy for the VNC session (geometry/depth/session/security)
    ansible.builtin.copy:
      dest: /etc/tigervnc/vncserver-config-mandatory
      content: |
        # Managed by ansible-stationctl (setup-remote-access.yml). Mandatory =
        # always wins over any per-user ~/.config/tigervnc/config.pl.
        $geometry = "{{ vnc_geometry }}";
        $depth = {{ vnc_depth }};
        $session = "mate";
        $localhost = "no";
        $SecurityTypes = "VncAuth";
        1;
      owner: root
      group: root
      mode: "0644"
    notify: Restart VNC server
    tags: [remote-access, vnc, systemd]

  # vnc_service_enabled defaults to true (existing always-on behavior,
  # e.g. remote-workstation) — override to false in a host's host_vars to
  # leave VNC off by default there (see local-workstation/main.yml: an
  # always-on standing VNC/MATE session was found racing the physical
  # seat0 session for udisks2 mount requests, breaking USB mounting).
  - name: Enable and start the packaged VNC server on configured display
    ansible.builtin.systemd:
      name: "tigervncserver@:{{ vnc_display }}.service"
      state: started
      enabled: true
      daemon_reload: true
    when: vnc_service_enabled | default(true) | bool
    tags: [remote-access, vnc, systemd]

  - name: "Ensure the packaged VNC server is stopped and disabled (vnc_service_enabled: false)"
    ansible.builtin.systemd:
      name: "tigervncserver@:{{ vnc_display }}.service"
      state: stopped
      enabled: false
      daemon_reload: true
    when: not (vnc_service_enabled | default(true) | bool)
    tags: [remote-access, vnc, systemd]

  # ── Manual VNC on/off desktop launcher (this host only) ──────────────
  # Host opts in via deploy_vnc_toggle_launcher: true in its host_vars.
  # Uses pkexec (not a NOPASSWD sudoers entry) so it stays gated behind
  # the normal polkit admin-auth prompt on every use, not a standing
  # passwordless privilege — matches how manual/occasional this action is.
  - name: "[VNC toggle] Deploy the toggle script"
    ansible.builtin.copy:
      dest: /usr/local/bin/vnc-toggle.sh
      owner: root
      group: root
      mode: "0755"
      content: |
        #!/bin/sh
        # vnc-toggle.sh — start/stop this workstation's TigerVNC remote-desktop
        # service. Deployed by setup-remote-access.yml (deploy_vnc_toggle_launcher).
        set -eu

        SERVICE="tigervncserver@:{{ vnc_display }}.service"

        if systemctl is-active --quiet "$SERVICE"; then
          pkexec systemctl stop "$SERVICE"
          notify-send -i network-vpn "Remote Desktop (VNC)" "VNC service stopped."
        else
          pkexec systemctl start "$SERVICE"
          notify-send -i network-vpn "Remote Desktop (VNC)" "VNC service started."
        fi
    when: deploy_vnc_toggle_launcher | default(false) | bool
    tags: [remote-access, vnc, toggle-launcher]

  - name: "[VNC toggle] Deploy the desktop launcher"
    ansible.builtin.copy:
      dest: /usr/share/applications/vnc-toggle.desktop
      owner: root
      group: root
      mode: "0644"
      content: |
        [Desktop Entry]
        Type=Application
        Name=Toggle Remote Desktop (VNC)
        Comment=Start or stop this workstation's TigerVNC remote desktop service
        Exec=/usr/local/bin/vnc-toggle.sh
        Icon=network-vpn
        Terminal=false
        Categories=System;Utility;
        NoDisplay=false
    when: deploy_vnc_toggle_launcher | default(false) | bool
    tags: [remote-access, vnc, toggle-launcher]

  # ── Manual VNC restart launcher (this host only) ──────────────────────
  # For VNC-primary hosts (e.g. remote-workstation) — VNC is always on
  # here, so there's no "off" state worth toggling; this just gives the
  # user a one-click way to kick a stuck/frozen VNC session without
  # waiting on anything automatic. Same pkexec pattern as the toggle
  # launcher above (no standing NOPASSWD privilege).
  - name: "[VNC restart] Deploy the restart script"
    ansible.builtin.copy:
      dest: /usr/local/bin/vnc-restart.sh
      owner: root
      group: root
      mode: "0755"
      content: |
        #!/bin/sh
        # vnc-restart.sh — restart this workstation's TigerVNC remote-desktop
        # service. Deployed by setup-remote-access.yml (deploy_vnc_restart_launcher).
        set -eu

        SERVICE="tigervncserver@:{{ vnc_display }}.service"

        pkexec systemctl restart "$SERVICE"
        notify-send -i network-vpn "Remote Desktop (VNC)" "VNC service restarted."
    when: deploy_vnc_restart_launcher | default(false) | bool
    tags: [remote-access, vnc, restart-launcher]

  - name: "[VNC restart] Deploy the desktop launcher"
    ansible.builtin.copy:
      dest: /usr/share/applications/vnc-restart.desktop
      owner: root
      group: root
      mode: "0644"
      content: |
        [Desktop Entry]
        Type=Application
        Name=Restart Remote Desktop (VNC)
        Comment=Restart this workstation's TigerVNC remote desktop service
        Exec=/usr/local/bin/vnc-restart.sh
        Icon=network-vpn
        Terminal=false
        Categories=System;Utility;
        NoDisplay=false
    when: deploy_vnc_restart_launcher | default(false) | bool
    tags: [remote-access, vnc, restart-launcher]

  - name: Download Tailscale install script
    ansible.builtin.get_url:
      url: https://tailscale.com/install.sh
      dest: /tmp/tailscale-install.sh
      mode: "0755"
    # /tmp is tmpfs (wiped every reboot) and the actual install stays
    # idempotent via the next task's `creates:` guard — this download
    # reporting changed=true isn't meaningful config-drift, just get_url
    # not getting stable caching headers from tailscale.com (found via
    # the idempotency-check wrapper, 2026-09-19).
    changed_when: false
    tags: [remote-access, tailscale]

  - name: Run Tailscale install script (idempotent, no-op if already installed)
    ansible.builtin.command: /bin/sh /tmp/tailscale-install.sh
    args:
      creates: /usr/sbin/tailscaled
    tags: [remote-access, tailscale]

  - name: Ensure tailscaled service is enabled and running
    ansible.builtin.service:
      name: tailscaled
      state: started
      enabled: true
    tags: [remote-access, tailscale]

  - name: Print remote access summary
    ansible.builtin.debug:
      msg:
      - "========================================================"
      - "Remote access ready on: {{ inventory_hostname }}"
      - "  VNC display:  :{{ vnc_display }} ({{ vnc_geometry }}, {{ vnc_depth }}bpp)"
      - "  VNC password: set from vnc_password in group_vars/all/main.yml (vault)"
      - "  Tailscale:    installed, run 'tailscale up' once to authenticate"
      - "========================================================"
    tags: [remote-access, summary]

  - name: Flush handlers so the restart-skip note below reflects what actually happened
    ansible.builtin.meta: flush_handlers

  - name: Note that a pending VNC config change did not take effect
    ansible.builtin.debug:
      msg: >-
        VNC config/password changed on {{ inventory_hostname }} but the restart was
        skipped because a session was active and the restart wasn't confirmed via the
        on-screen dialog — the new config takes effect on the next natural restart or logout.
    when: vnc_has_active_session and not (vnc_restart_ok | default(true) | bool)
    tags: [remote-access, vnc, summary]

  handlers:
  - name: Reload systemd
    ansible.builtin.systemd:
      daemon_reload: true

  - name: Restart VNC server
    ansible.builtin.systemd:
      name: "tigervncserver@:{{ vnc_display }}.service"
      state: restarted
    # Never let a config-change notification turn VNC back on for a host
    # that has it deliberately off (vnc_service_enabled: false) — found
    # 2026-09-21: this handler fired on local-workstation from an
    # unrelated config task and restarted (started) the service seconds
    # after the "stopped and disabled" task above had just turned it off.
    when: (vnc_restart_ok | default(true) | bool) and (vnc_service_enabled | default(true) | bool)
    failed_when: false
