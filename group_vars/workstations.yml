  - libssl-dev
  - libusb-1.0-0-dev
  - swig
  - u-boot-tools
  - uuid-dev
  - uuid-runtime
  - zlib1g-dev
  - dwarves
  - libgnutls28-dev
  # imaging (plymouth spinner/image conversion)
  - imagemagick
  # filesystem & partition tooling
  - dosfstools
  - e2fsprogs
  - parted
  - gdisk
  - fdisk
  # core/misc utilities
  - binfmt-support
  - arch-test
  - lz4
  - unzip
  - zip
  - pigz
  - xz-utils
  - pbzip2
  - lzop
  - zstd
  - bc
  - bsdextrautils
  - ca-certificates
  - cpio
  - dialog
  - dirmngr
  - gawk
  - gettext
  - gnupg
  - gpg
  - jq
  - kmod
  - libfile-fcntllock-perl
  - linux-base
  - locales
  - lsof
  - ncurses-base
  - ncurses-term
  - ntpsec-ntpdate
  - patchutils
  - pv
  - rsync
  - udev
  - file
  - tree
  - expect
  - colorized-logs
  - aria2
  - curl
  - axel
  - wget
  - parallel
  - rdfind
  - binwalk
  - bash
  - git
  - psmisc
  # python (Armbian's own tooling + u-boot builds)
  - python3
