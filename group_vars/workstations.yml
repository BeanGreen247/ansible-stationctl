# ---------------------------------------------------------------------------
# Python (pip) tooling used by the custom scripts that live in this
# workstation's home dir (ansible-proxmox-ssh-gui-tool, OptiPing, the
# starhaven node exporter, crafty tweaks). Debian 13 is PEP 668
# "externally managed" — installed with --break-system-packages in
# setup-dev-tools.yml, matching how they're actually installed on Nebula.
#
# This list is a living baseline, not a per-app pin — as game-port build
# work starts, add build/runtime libs here (SDL2, cmake, etc.) rather than
# installing them ad hoc on one machine.
# ---------------------------------------------------------------------------
workstation_pip_packages:
  - customtkinter
  - fastapi
  - "uvicorn[standard]"
  - aiohttp
  - ping3
  - toml
  - python-socketio
  - python-multipart
  - pyotp
  - qrcode
  - prometheus_client
  - peewee
  # Used by the redhat.ansible VS Code extension's built-in lint integration
  # against this repo's own playbooks. Found broken on remote-workstation
  # 2026-09-18 (manually installed, missing wcmatch/jsonschema/black/etc. —
  # a partial/interrupted pip install, not a version issue) — ansible.builtin.pip
  # resolves the full dependency tree correctly, unlike the ad-hoc fix, so
  # this prevents the same breakage recurring on any other workstation.
  - ansible-lint

# ---------------------------------------------------------------------------
# Remote access (setup-remote-access.yml)
# ---------------------------------------------------------------------------
remote_access_packages:
  - tigervnc-standalone-server
  - tigervnc-common
  - tigervnc-tools
vnc_display: "1"
vnc_geometry: "1920x1080"
vnc_depth: 16

# VNC-restart confirmation dialog (setup-remote-access.yml's safety gate) —
# only installed/used when a MATE session is actually found running for
# vm_enduser_name at play time. See the "Ask the logged-in user before
# restarting VNC" task for why this replaced a plain CLI `pause`: a pause
# prompt only works when the playbook is run from an attached terminal, and
# silently can't block anything when driven non-interactively (found
# 2026-09-21 — a non-interactive run restarted VNC and dropped a live
# session because the old TCP-ESTABLISHED check missed it).
vnc_restart_prompt_packages:
  - zenity           # general-purpose GUI dialog tool for future ad-hoc scripts (not used by
                      # the restart prompt itself — that uses yad below, which supports the
                      # gradient theming/timeout this dialog needed and zenity's build doesn't)
  - libnotify-bin    # notify-send — the heads-up toast fired just before the dialog maps
  - yad               # the actual confirmation dialog — richer theming/timeout support than zenity
  - wmctrl            # sets _NET_WM_STATE_DEMANDS_ATTENTION so the taskbar entry flags the dialog
  - xdotool            # locates/centers/raises the dialog window on the user's real screen
  - x11-xkb-utils        # xkbbell — rings the X bell, which marco's visual-bell turns into a screen flash
vnc_restart_prompt_timeout: 45

# ---------------------------------------------------------------------------
# Dev applets (setup-dev-applets.yml) — ported from the user's kubuntu-setup
# reference project (github.com/BeanGreen247/kubuntu-setup): apt-key-refresh,
# dotfile-sync, and the dotfile-sync-tray/infra-connections status applets.
# ---------------------------------------------------------------------------
dotfile_sync_interval_hours: 12
dotfile_sync_backup_count: 5

dotfile_sync_files:
  - name: bashrc
    url: https://raw.githubusercontent.com/BeanGreen247/dotfiles/master/bashrc/bashrc
    dest: "~/.bashrc"
  - name: vimrc
    url: https://raw.githubusercontent.com/BeanGreen247/dotfiles/master/vim/vimrc
    dest: "~/.vimrc"
  - name: claude-md
    url: https://raw.githubusercontent.com/BeanGreen247/dotfiles/master/claude/CLAUDE.md
    dest: "~/.claude/CLAUDE.md"
