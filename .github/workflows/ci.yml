name: CI

on:
  push:
  pull_request:

jobs:
  test-playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible, ansible-lint, yamllint
        run: pip install --user ansible ansible-lint yamllint

      - name: Create placeholder vault password file
        # ansible.cfg points at ~/.vault_pass.txt (gitignored, real value
        # only exists on the maintainer's machine). Nothing vaulted is
        # ever actually decrypted here — group_vars/all/main.yml and
        # host_vars/*/vault.yml are gitignored too, so a fresh CI
        # checkout never has real vaulted content to decrypt. Ansible
        # still refuses to run at all if the configured vault password
        # file is simply missing, so this just needs to exist.
        run: echo "unused-in-ci" > ~/.vault_pass.txt

      - name: Run playbook tests (syntax-check + lint)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/test_playbooks.sh
