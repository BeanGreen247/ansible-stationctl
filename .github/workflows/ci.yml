name: CI

on:
  push:
  pull_request:

jobs:
  test-playbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible, ansible-lint, yamllint
        run: pip install --user ansible ansible-lint yamllint

      - name: Run playbook tests (syntax-check + lint)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/test_playbooks.sh
