# setup-dev-tools.yml
#
# Overview
#   Installs the day-to-day development tool set (trimmed from the reference
#   machine's actual installed-tool audit — git, build tools, Docker, Python,
#   Node.js, GitHub CLI). Skips anything desktop/XFCE-specific that isn't
#   relevant to a MATE workstation.
#
# Target hosts
#   ansible-playbook setup-dev-tools.yml --limit workstations
#
# Credit: Thomas Mozdren
---
- name: Install development tools
  hosts: workstations
  become: true
  gather_facts: true

  tasks:

  # Debian 13's own `nodejs` package is v20 — too old for
  # @anthropic-ai/claude-code (requires >=22) and other modern npm
  # tooling. NodeSource's repo (same signed-by pattern as Brave in
  # setup-mate-desktop.yml) gets an actually-current Node instead.
  - name: Ensure /etc/apt/keyrings exists (for NodeSource's signed-by repo)
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"
    tags: [dev, nodejs]

  - name: Add NodeSource apt signing key
    ansible.builtin.get_url:
      url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      dest: /etc/apt/keyrings/nodesource.gpg
      mode: "0644"
    tags: [dev, nodejs]

  - name: Add NodeSource apt repository (Node {{ nodejs_major_version | default(22) }}.x)
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_major_version | default(22) }}.x nodistro main"
      filename: nodesource
      state: present
      update_cache: true
    tags: [dev, nodejs]

  # `state: present` on the general dev_packages install below won't swap
  # an already-installed nodejs to NodeSource's version once apt already
  # considers "present" satisfied by Debian's stock v20 — force it here.
  - name: Ensure nodejs is upgraded to the NodeSource version
    ansible.builtin.apt:
      name: nodejs
      state: latest
    tags: [dev, nodejs]

  # Debian's repos don't carry the .NET SDK — Microsoft's own apt repo does.
  # Needed to build .NET projects (e.g. jellyfin-storage-manager, net9.0)
  # locally. Using Microsoft's own packages-microsoft-prod.deb (their
  # documented install method) rather than hand-building the repo entry —
  # the actual signing key on this repo (a 2023 "General GPG Signer" key)
  # differs from the well-known microsoft.asc release key, and this .deb
  # is the canonical source for the correct one.
  - name: Download packages-microsoft-prod.deb
    ansible.builtin.get_url:
      url: "https://packages.microsoft.com/config/debian/{{ ansible_distribution_major_version }}/packages-microsoft-prod.deb"
      dest: /tmp/packages-microsoft-prod.deb
      mode: "0644"
    tags: [dev, dotnet]

  - name: Install Microsoft apt repository + keyring (.NET SDK)
    ansible.builtin.apt:
      deb: /tmp/packages-microsoft-prod.deb
    register: _ms_repo
    tags: [dev, dotnet]

  # update_cache on the `deb:` install above isn't honored (it only applies
  # to name-based installs), and the dev_packages task below has its own
  # cache_valid_time that can otherwise treat a stale cache as fresh right
  # after this repo file lands — always force a real update here regardless
  # of _ms_repo.changed so dotnet-sdk-9.0 is visible to apt afterward.
  - name: Update APT cache after adding Microsoft's repo
    ansible.builtin.apt:
      update_cache: true
    tags: [dev, dotnet]

  # VS Code's own repo is signed with Microsoft's classic release key
  # (the well-known microsoft.asc, NOT the newer key the .NET repo above
  # uses — verified: `gpg --verify` on the repo's InRelease reports key
  # EB3E94ADBE1229CF, matching microsoft.asc, not the .NET repo's
  # EE4D7792F748182B). Same signed-by pattern as NodeSource/Brave.
  - name: Add Microsoft VS Code apt signing key
    ansible.builtin.get_url:
      url: https://packages.microsoft.com/keys/microsoft.asc
      dest: /etc/apt/keyrings/microsoft.gpg
      mode: "0644"
      force: true
    tags: [dev, vscode]

  - name: Add Microsoft VS Code apt repository
    ansible.builtin.apt_repository:
      repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
      filename: vscode
      state: present
      update_cache: true
    tags: [dev, vscode]

  - name: Install VS Code
    ansible.builtin.apt:
      name: code
      state: present
    tags: [dev, vscode]

  # VS Code Settings Sync stores its OAuth refresh token via libsecret,
  # which needs a working Secret Service provider — confirmed missing
  # entirely on the VM (gnome-keyring wasn't installed at all). Installing
  # it fixes that baseline gap, but doesn't fully solve sync sign-outs by
  # itself: gnome-keyring's auto-unlock (libpam-gnome-keyring, already
  # wired into lightdm's PAM stack) only fires on a real PAM login event.
  # remote-workstation's VNC session is started by tigervncserver@.service
  # directly, with no PAM login in the path at all, so the keyring would
  # stay locked there regardless. Per VS Code's own Settings Sync
  # troubleshooting docs (docs/configure/settings-sync#_troubleshooting-
  # keychain-issues), the documented fix for exactly this class of problem
  # is to bypass the OS keyring dependency entirely via
  # password-store=basic — applied fleet-wide below rather than only on
  # the VM, since local-workstation's lightdm-PAM path being structurally
  # correct doesn't guarantee the keyring's stored unlock password still
  # matches bean's current login password (no way to verify that without
  # bean testing an actual sign-in).
  - name: Install gnome-keyring (Secret Service provider for VS Code, etc.)
    ansible.builtin.apt:
      name:
        - gnome-keyring
        - libpam-gnome-keyring
      state: present
    tags: [dev, vscode]

  - name: Ensure end-user's ~/.config/Code directory exists
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.config/Code"
      state: directory
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0755"
    when: vm_enduser_name | default('') | length > 0
    tags: [dev, vscode]

  - name: Set VS Code to use basic password-store (Settings Sync keyring workaround)
    ansible.builtin.copy:
      dest: "/home/{{ vm_enduser_name }}/.config/Code/argv.json"
      content: |
        // This file has been auto-generated by ansible-stationctl (setup-dev-tools.yml).
        // See: https://code.visualstudio.com/docs/configure/settings-sync#_troubleshooting-keychain-issues
        {
            "password-store": "basic"
        }
      owner: "{{ vm_enduser_name }}"
      group: "{{ vm_enduser_name }}"
      mode: "0644"
      force: false
    when: vm_enduser_name | default('') | length > 0
    tags: [dev, vscode]

  # VS Code ships a built-in "Agents" profile (~/.config/Code/User/profiles/
  # builtin/agents) tied to the Chat/Agents feature we disable everywhere via
  # chat.disableAIFeatures. Confirmed on 2026-09-18 that removing both the
  # directory and its userDataProfiles entry in globalStorage/storage.json is
  # permanent — VS Code does not recreate it on next launch once the Agents
  # feature is disabled. Both steps are safe/idempotent on a fresh host where
  # neither has been created yet (file/module no-op when the target is
  # already absent).
  - name: Remove VS Code's built-in Agents profile directory
    ansible.builtin.file:
      path: "/home/{{ vm_enduser_name }}/.config/Code/User/profiles/builtin"
      state: absent
    when: vm_enduser_name | default('') | length > 0
    tags: [dev, vscode]

  - name: Check whether globalStorage/storage.json exists yet
    ansible.builtin.stat:
      path: "/home/{{ vm_enduser_name }}/.config/Code/User/globalStorage/storage.json"
    register: _vscode_storage_json
    when: vm_enduser_name | default('') | length > 0
    tags: [dev, vscode]

  - name: Check whether storage.json still references the Agents profile
    ansible.builtin.command:
      cmd: grep -q '"builtin/agents"' "/home/{{ vm_enduser_name }}/.config/Code/User/globalStorage/storage.json"
    register: _agents_profile_present
    changed_when: false
    failed_when: false
    when:
      - vm_enduser_name | default('') | length > 0
      - _vscode_storage_json.stat.exists
    tags: [dev, vscode]

  # Expression-only Python (no for/if blocks) so it survives being passed as
  # a single argv entry without YAML folding mangling indentation — that's
  # what broke the first version of this task (block-scalar folding
  # collapsed the for-loop's newlines into spaces, breaking Python syntax).
  - name: Strip the Agents profile entry from globalStorage/storage.json
    ansible.builtin.command:
      argv:
        - python3
        - -c
        - |
          import json
          path = '/home/{{ vm_enduser_name }}/.config/Code/User/globalStorage/storage.json'
          d = json.load(open(path))
          d['userDataProfiles'] = [p for p in d.get('userDataProfiles', []) if p.get('location') != 'builtin/agents']
          assoc = d.get('profileAssociations', {}).get('workspaces', {})
          [assoc.__setitem__(k, '__default__profile__') for k, v in list(assoc.items()) if v == 'builtin/agents']
          json.dump(d, open(path, 'w'), indent=4)
    when:
      - vm_enduser_name | default('') | length > 0
      - _vscode_storage_json.stat.exists
      - _agents_profile_present.rc == 0
    tags: [dev, vscode]

  # settings.json and installed extensions are deliberately NOT managed here
  # (no seed content, no lineinfile/blockinfile patches, no extension
  # installs). Both are owned by VS Code Settings Sync against the end
  # user's own GitHub account instead — Copilot/AI-tool blocking
  # (extensions.allowed), chat.disableAIFeatures, Todo-Tree's ripgrep path,
  # etc. all live in the synced settings.json itself and propagate to every
  # machine on that account on their own. Re-running this playbook must not
  # fight that: it only touches argv.json (below), which Settings Sync does
  # not cover.

  - name: Install dev tool packages
    ansible.builtin.apt:
      name: "{{ dev_packages }}"
      state: present
      update_cache: true
      cache_valid_time: 3600
    tags: [dev, packages]

  # Installed fleet-wide, not just where the framework is cloned today — see
  # the package list's own comment in group_vars/workstations.yml for why
  # this is pre-seeded instead of left to compile.sh's own self-provisioning.
  - name: Install Armbian Build Framework host dependencies
    ansible.builtin.apt:
      name: "{{ armbian_build_framework_packages }}"
      state: present
    tags: [dev, packages, armbian]

  - name: Install sysadmin/dev CLI toolkit (curated from kubuntu-setup)
    ansible.builtin.apt:
      name: "{{ sysadmin_cli_packages }}"
      state: present
    when: sysadmin_cli_packages | default([]) | length > 0
    tags: [dev, packages, cli-tools]

  # Debian ships these under their historical names to avoid clashing with
  # older unrelated packages already using "bat"/"fd" — same fix
  # kubuntu-setup applies.
  - name: Symlink bat/fd to their upstream names
    ansible.builtin.file:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      state: link
    loop:
      - { src: /usr/bin/batcat, dest: /usr/local/bin/bat }
      - { src: /usr/bin/fdfind, dest: /usr/local/bin/fd }
    when: sysadmin_cli_packages | default([]) | length > 0
    tags: [dev, packages, cli-tools]

  # --ignore-installed: some of these (fastapi -> typing-extensions, etc.)
  # need a newer version than what an apt package (python3-dev among others)
  # already dropped into dist-packages. Those apt-owned copies have no pip
  # RECORD file, so pip's normal upgrade path fails trying to uninstall them
  # first ("no RECORD file was found" / "uninstall-no-record-file"). Ignoring
  # the already-installed version makes pip install its own copy alongside
  # it instead of trying to remove the dpkg-owned one.
  - name: Install pip tooling for the custom scripts in this workstation's home dir
    ansible.builtin.pip:
      name: "{{ workstation_pip_packages }}"
      extra_args: --break-system-packages --ignore-installed
    when: workstation_pip_packages | default([]) | length > 0
    tags: [dev, pip]

  - name: Add end-user to docker group
    ansible.builtin.user:
      name: "{{ vm_enduser_name }}"
      groups: docker
      append: true
    when: vm_enduser_name | default('') | length > 0
    tags: [dev, docker]

  # Default json-file log driver has no size cap — a long-running container
  # (or one that's chatty on stdout/stderr) can grow its log file unbounded
  # on a small-disk workstation, same class of problem journald was already
  # capped for in setup-kernel-perf-tuning.yml. max-size/max-file bound it
  # per container instead.
  - name: Cap docker container log size (json-file driver)
    ansible.builtin.copy:
      dest: /etc/docker/daemon.json
      content: |
        {
          "log-driver": "json-file",
          "log-opts": {
            "max-size": "10m",
            "max-file": "3"
          }
        }
      owner: root
      group: root
      mode: "0644"
    notify: Restart docker
    tags: [dev, docker]

  - name: Ensure docker service is enabled and running
    ansible.builtin.service:
      name: docker
      state: started
      enabled: true
    tags: [dev, docker]

  - name: Set global git identity for end-user
    community.general.git_config:
      name: "{{ item.key }}"
      value: "{{ item.value }}"
      scope: global
    become: true
    become_user: "{{ vm_enduser_name }}"
    loop:
      - { key: "user.name", value: "{{ git_user_name | default('') }}" }
      - { key: "user.email", value: "{{ git_user_email | default('') }}" }
    when:
      - vm_enduser_name | default('') | length > 0
      - git_user_name | default('') | length > 0
      - git_user_email | default('') | length > 0
    tags: [dev, git]

  handlers:
  - name: Restart docker
    ansible.builtin.systemd:
      name: docker
      state: restarted
